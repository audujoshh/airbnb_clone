<!DOCTYPE html>
<html>
    <head>
        <title>

        </title>
    </head>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            margin: 0;
            width: auto;
        }
        .login-container h4{
            font-size: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .login-container h2{
            text-align: left;
            font-size: 25px;
        }
        .phone-input select,
        .phone-input input{
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .phone-input{
            display: flex;
            flex-direction: column;
        }
    .login-container{
        background: white;
        padding: 40px 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        width: 450px;
        }
        .login-container button{
            width: 100%;
            padding: 12px;
            background-color: #ff385c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;

        }
        .login-container button:hover {
            background-color: #d42b4a;
        }
        .line {
            margin: 20px 0;
            text-align: center;
            position: relative;
        }
        .social-btn button{
            background: white;
            border: 1px solid #ccc;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        .social-btn img {
            height: 20px;
            margin-right: 100px;
        }
        a {
            text-decoration: none;
            color: white;
        }
        a:hover {
            text-decoration: underline;
        }
</style>

    <body>
        <div class="login-container">
        <h4>Log in or sign up</h4>
        <hr>
        <h2>Welcome to Airbnb</h2>

        <div class="phone-input">
        <select>
            <option selected disabled>Choose country...</option>
            <option value="+1">US (+1)</option>
            <option value="+44">UK (+44)</option>
            <option value="+61">Australia (+61)</option>
            <option value="+234">Nigeria (+234)</option>
            <option value="+91">India (+91)</option>
            <option value="+1">Canada (+1)</option>
            <option value="+49">Germany (+49)</option>
            <option value="+33">France (+33)</option>
            <option value="+86">China (+86)</option>
            <option value="+27">South Africa (+27)</option>
            <option value="+52">Mexico (+52)</option>
            <option value="+7">Rusia (+7)</option>
            <option value="+966">Saudi Arabia (+966)</option>
            <option value="+20">Egypt (+20)</option>
            <option value="+34">Spain (+34)</option>
            <option value="+55">India (+55)</option>
        </select>
        <input type="text" placeholder="Phone number" required>
    </div>
        <button type="submit"><a href="index.html" target="_blank">Continue</a></button>

        <p>We'll call or text you to confirm this number. Standard messsages and data rates apply. <a href="/signup">Privacy policy</a></p>
    <div class="line"><span>or</span></div>

    <div class="social-btn">
        <form action="/submit-page" method="POST">
        <button type="submit">
            <img src="google.png.png" alt="Google Icon">
            Continue with Google
        </button>

        <button type="submit">
            <img src="facebook.png" alt="Facebook Icon">
            Continue with Facebook
        </button>
        <button type="submit">
            <img src="apple.png" alt="Apple Icon">
            Continue with Apple
        </button>
     
    </form>

    </div>
    </a>
    </div>
    </body>
</html>
